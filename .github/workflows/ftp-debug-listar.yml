name: FTP Debug - listar diretorios

on:
  workflow_dispatch:

jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Listar arvore do FTP (somente leitura)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          echo "===== PWD (raiz da sessao) ====="
          pwd
          echo "===== LS raiz ====="
          ls
          echo "===== LS .. ====="
          cd ..
          pwd
          ls
          echo "===== LS ../.. ====="
          cd ..
          pwd
          ls
          bye
          EOF
